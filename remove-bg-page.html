<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Background Remover - ImageCraft</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    body {
      font-family: Inter, sans-serif;
      background: #f8fafc;
      margin: 0;
      padding: 0;
    }

    .tool-page {
      max-width: 700px;
      margin: 60px auto;
      background: #fff;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    .tool-page h1 {
      margin-bottom: 10px;
    }

    .tool-page p {
      color: #555;
      margin-bottom: 20px;
    }

    .upload-box {
      border: 2px dashed #ccc;
      padding: 30px;
      border-radius: 16px;
      text-align: center;
      margin-bottom: 20px;
    }

    input[type="file"] {
      width: 100%;
      margin-top: 10px;
      margin-bottom: 20px;
    }

    button {
      background: #111827;
      color: white;
      border: none;
      padding: 14px 22px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      opacity: 0.9;
    }

    #result {
      margin-top: 20px;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 20px;
      text-decoration: none;
      color: #111827;
      font-weight: 600;
    }

    .preview {
      margin-top: 20px;
      text-align: center;
    }

    .preview img {
      max-width: 100%;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
    }
  </style>
</head>
<body>

  <div class="tool-page">
    <a href="/" class="back-link">← Back to Home</a>

    <h1>Background Remover</h1>
    <p>Upload your image and remove the background instantly.</p>

    <form id="removeBgForm">
      <div class="upload-box">
        <label>Select Image</label>
        <input type="file" id="imageFile" name="file" accept="image/*" required />
      </div>

      <button type="submit">Remove Background</button>
    </form>

    <div id="result"></div>
  </div>

  <script>
  const form = document.getElementById("removeBgForm");
  const result = document.getElementById("result");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const fileInput = document.getElementById("imageFile");
    const file = fileInput.files[0];

    if (!file) {
      result.innerHTML = "<p style='color:red;'>Please select an image.</p>";
      return;
    }

    const formData = new FormData();
    formData.append("file", file);

    result.innerHTML = "<p>Removing background...</p>";

    try {
      const response = await fetch("/remove-bg", {
        method: "POST",
        body: formData
      });

      const contentType = response.headers.get("content-type") || "";

      if (!contentType.includes("application/json")) {
        throw new Error("Server error (possibly 502). Please check deployment logs.");
      }

      const data = await response.json();

      if (!response.ok || !data.success) {
        throw new Error(data.message || "Background removal failed");
      }

      result.innerHTML = `
        <p style="color:green;">${data.message}</p>
        <div class="preview">
          <img src="${data.download_url}" alt="Background Removed Image" />
        </div>
        <br>
        <a href="${data.download_url}" download>
          <button type="button">Download Image</button>
        </a>
      `;
    } catch (error) {
      result.innerHTML = `<p style='color:red;'>${error.message}</p>`;
    }
  });
</script>

</body>
</html>
